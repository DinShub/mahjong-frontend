name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Regenerating the visual baselines. They are Linux PNGs rendered with this image's fonts, so
  # they cannot be produced on a developer's machine — see the `baselines` job at the bottom.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Re-render the visual baselines and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Skipped on a baseline-regeneration run: the visual step is *expected* to differ there, and
    # a red X on a run whose whole purpose was to produce new images teaches nothing.
    if: github.event_name != 'workflow_dispatch' || !inputs.update_snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:cov

      # Verifies the synced contract has not been hand-edited. When BACKEND_REPO is configured the
      # step below also proves it matches the backend's main — that is the real drift gate.
      - name: Contract integrity
        run: npm run check:contracts

      - name: Contract drift vs backend main
        if: vars.BACKEND_REPO != ''
        env:
          BACKEND_REPO: ${{ vars.BACKEND_REPO }}
        run: |
          git clone --depth 1 --branch main "https://github.com/${BACKEND_REPO}.git" ../backend-main
          npm run check:contracts -- --backend ../backend-main

      # The recorded games the store, the layout and the e2e suite all run against. Same rule as
      # the contract: generated by the backend, never hand-edited here.
      - name: Fixture integrity
        run: npm run check:fixtures

      - name: Fixture drift vs backend main
        if: vars.BACKEND_REPO != ''
        run: npm run check:fixtures -- --backend ../backend-main

      # The shipped tile sheet is generated from the vendored CC0 art. Same rule again: a generated
      # file that can drift from its source is a generated file nobody can trust.
      - name: Tile sprite drift
        run: npm run check:tiles

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npx playwright test --project=chromium --project=mobile-chrome

      # Screenshots are platform-specific; the baselines committed here are Linux ones, taken on
      # this image. A local run on macOS or Windows writes its own alongside them.
      - name: Visual regression
        run: npx playwright test --project=visual

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Becomes a gate in M6 (tasks/backlog.md).
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Visual baselines
  # ---------------------------------------------------------------------------
  #
  # Run with:  gh workflow run ci.yml -f update_snapshots=true
  #
  # No webfont is shipped (see ASSETS.md), so every screenshot is drawn in the platform's own
  # fonts and a baseline rendered on Windows or macOS will never match this image. The images this
  # job uploads are the runner's own output; download them, **look at each one**, and commit them.
  #
  # It uploads rather than pushes on purpose. A job that committed its own baselines would make
  # every visual regression self-certifying — the failure mode this suite exists to catch.
  baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `--update-snapshots` rewrites every baseline the project touches, including ones that did
      # not change; the diff in review is what shows which actually moved.
      - name: Re-render the visual baselines
        run: npx playwright test --project=visual --update-snapshots

      - name: Upload the baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 7
